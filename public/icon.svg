  <ellipse cx="50" cy="52" rx="34" ry="18" stroke="#e0e7ff" strokeWidth="2.5" strokeDasharray="4 3" strokeOpacity="0.85" transform="rotate(-18 50 52)" />
  <circle cx="78" cy="42" r="3.5" fill="#38bdf8" />
  <circle cx="22" cy="62" r="2.5" fill="#a78bfa" />

  <!-- Book Pages -->
  <path d="M 50 68 C 42 62, 28 62, 22 66 L 22 42 C 28 38, 42 38, 50 44 Z" fill="url(#favBookGrad)" stroke="rgba(255, 255, 255, 0.6)" strokeWidth="1.2" />
  <path d="M 50 68 C 58 62, 72 62, 78 66 L 78 42 C 72 38, 58 38, 50 44 Z" fill="url(#favBookGrad)" stroke="rgba(255, 255, 255, 0.6)" strokeWidth="1.2" />
  <line x1="50" y1="44" x2="50" y2="70" stroke="#4338ca" strokeWidth="2.5" strokeLinecap="round" />

  <!-- Apex Star -->
