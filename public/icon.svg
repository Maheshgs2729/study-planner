      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="50%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <linearGradient id="favBookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#e0e7ff" stopOpacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#favPrimaryGrad)" />
  <rect x="6" y="6" width="88" height="88" rx="24" stroke="rgba(255, 255, 255, 0.4)" strokeWidth="2" fill="none" />

